<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1.0, user-scalable=no">
  <title>DJI H1 flight route</title>
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    #state {
      position: absolute; inset: 0; z-index: 10; display: flex;
      align-items: center; justify-content: center; pointer-events: none;
      color: #3f4850; background: #eef2f5; font: 14px sans-serif;
    }
  </style>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>
  <div id="map"></div>
  <div id="state">Loading Baidu Map…</div>
  <script>
    "use strict";
    let map = null;
    let bridge = null;
    let mission = null;
    let measurementLayer = null;
    let selectedMarker = null;
    let baiduLoadStarted = false;

    function reportError(message) {
      const state = document.getElementById("state");
      state.textContent = message;
      state.style.display = "flex";
      if (bridge) bridge.mapError(message);
    }

    function point(item) {
      return new BMapGL.Point(item.longitude_deg, item.latitude_deg);
    }

    function nearestMeasurement(clicked) {
      let nearest = null;
      let best = Infinity;
      mission.measurements.forEach(function(item) {
        const dx = item.longitude_deg - clicked.lng;
        const dy = item.latitude_deg - clicked.lat;
        const distance = dx * dx + dy * dy;
        if (distance < best) {
          best = distance;
          nearest = item;
        }
      });
      return nearest;
    }

    function addPointCollection(items, options, clickHandler) {
      if (!items.length) return null;
      const layer = new BMapGL.PointCollection(items.map(point), options);
      map.addOverlay(layer);
      if (clickHandler) layer.addEventListener("click", clickHandler);
      return layer;
    }

    window.setMissionData = function(data) {
      mission = data;
      if (!map) return;
      map.clearOverlays();
      selectedMarker = null;
      const routePoints = data.route.map(point);
      if (routePoints.length > 1) {
        map.addOverlay(new BMapGL.Polyline(routePoints, {
          strokeColor: "#52697a", strokeWeight: 3, strokeOpacity: 0.72
        }));
      }
      addPointCollection(data.route, {
        size: BMAP_POINT_SIZE_TINY,
        shape: BMAP_POINT_SHAPE_CIRCLE,
        color: "#8796a3"
      }, null);
      measurementLayer = addPointCollection(data.measurements, {
        size: BMAP_POINT_SIZE_SMALL,
        shape: BMAP_POINT_SHAPE_CIRCLE,
        color: "#087ea4"
      }, function(event) {
        const item = nearestMeasurement(event.point);
        if (item && bridge) bridge.measurementSelected(item.reflectance_index);
      });
      data.events.forEach(function(item) {
        const marker = new BMapGL.Marker(point(item));
        marker.setTitle(item.event_name.replaceAll("_", " "));
        marker.addEventListener("click", function() {
          if (bridge) bridge.eventSelected(item.event_index);
        });
        map.addOverlay(marker);
      });
      if (routePoints.length) map.setViewport(routePoints, {margins: [45, 45, 45, 45]});
    };

    window.clearMissionData = function() {
      mission = null;
      measurementLayer = null;
      selectedMarker = null;
      if (map) map.clearOverlays();
    };

    window.selectMeasurement = function(index) {
      if (!map || !mission) return;
      const item = mission.measurements.find(
        candidate => candidate.reflectance_index === index);
      if (!item) return;
      if (selectedMarker) map.removeOverlay(selectedMarker);
      selectedMarker = new BMapGL.Marker(point(item));
      selectedMarker.setTitle("Selected reflectance " + item.calculation_count);
      map.addOverlay(selectedMarker);
    };

    window.focusEvent = function(index) {
      if (!map || !mission) return;
      const item = mission.events.find(candidate => candidate.event_index === index);
      if (item) map.panTo(point(item));
    };

    window.fitMission = function() {
      if (!map || !mission || !mission.route.length) return;
      map.setViewport(mission.route.map(point), {margins: [45, 45, 45, 45]});
    };

    window.baiduApiReady = function() {
      if (typeof BMapGL === "undefined") {
        reportError("Baidu Map API did not load");
        return;
      }
      try {
        // Use imagery only. The satellite-specific vector street/POI layers
        // remain disabled, so this does not become the hybrid road map.
        map = new BMapGL.Map("map", {
          mapType: BMAP_SATELLITE_MAP,
          showVectorStreetLayer: false,
          showVectorLine: false
        });
        map.centerAndZoom(new BMapGL.Point(116.404, 39.915), 15);
        map.setMapType(BMAP_SATELLITE_MAP);
        map.setTrafficOff();
        map.enableScrollWheelZoom(true);
        document.getElementById("state").style.display = "none";
        bridge.mapReady();
      } catch (error) {
        reportError("Baidu Map initialization failed: " + error.message);
      }
    };

    function loadBaiduApi() {
      if (baiduLoadStarted) return;
      baiduLoadStarted = true;
      const script = document.createElement("script");
      script.async = true;
      script.src = "https://api.map.baidu.com/api?v=1.0&type=webgl" +
        "&ak=__BAIDU_MAP_AK__&callback=baiduApiReady";
      script.onerror = function() {
        reportError("Baidu Map API network request failed");
      };
      document.head.appendChild(script);
    }

    window.addEventListener("load", function() {
      new QWebChannel(qt.webChannelTransport, function(channel) {
        bridge = channel.objects.bridge;
        loadBaiduApi();
      });
    });
  </script>
</body>
</html>
