[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dji-h1-mission-viewer"
version = "0.1.0"
description = "PyQt decoder, route map, and viewer for DJI H1 flight records"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.7,<7", "PyQt6-WebEngine>=6.7,<7"]

[project.scripts]
dji-h1-viewer = "dji_h1_viewer.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dji_h1_viewer*"]

[tool.setuptools.package-data]
dji_h1_viewer = ["resources/*.html"]
